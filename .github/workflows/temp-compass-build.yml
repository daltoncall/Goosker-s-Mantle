name: Temp Compass 0.1.4 Build

on:
  push:
    branches:
      - temp-compass-build-014
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore Compass source
        shell: bash
        run: |
          cat compass-build/chunk1.b64 compass-build/chunk2.b64 | base64 -d > compass014-min.tar.xz
          tar -xJf compass014-min.tar.xz
      - name: Build Compass
        working-directory: min_compass014
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gooskers-compass-0.1.4-alpha
          path: min_compass014/build/libs/gooskers-compass-0.1.4-alpha.jar
